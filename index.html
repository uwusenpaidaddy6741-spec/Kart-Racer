<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kart Racer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

   <div id="game">
    <h1>KART RACER</h1>

    <div id="trackSelect">
    <h2>SELECT TRACK</h2>

    <div id="normalTracks">
        <button id="track1Button">TRACK 1</button>
        <button id="track2Button">FOREST RUN</button>
        <button id="track3Button">OASIS</button>

        <button id="timeTrialButton">TIME TRIAL</button>
    </div>

    <div id="timeTrialTracks" style="display: none;">
        <h2>TIME TRIAL</h2>

        <button id="timeTrialTrack1Button">TRACK 1</button>
        <button id="timeTrialTrack2Button">FOREST RUN</button>
        <button id="timeTrialTrack3Button">OASIS</button>
    </div>
</div>

        <div id="gameCanvasContainer">
            <canvas id="gameCanvas"></canvas>
        </div>

        <div id="controls">
            <p>WASD / Arrow Keys — Drive</p>
            <p>SPACE — Drift</p>
        </div>
    </div>

    <script type="module" src="game.js"></script>

</body>
</html>
